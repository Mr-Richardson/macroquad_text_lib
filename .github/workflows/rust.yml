name: Test, Deploy & Release

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Optimization Check
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Functionality Test
        run: cargo test --all-targets --all-features --locked

  publish:
    name: Publish
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Generate Changelog
        run: |
          echo "## [v$NEW_VERSION] - $(date +'%Y-%m-%d')" > temp_changelog.md
          echo "" >> temp_changelog.md
          if git log $LAST_TAG..HEAD --format="%s" | grep -q -E "^[a-z]+(\([a-z]+\))?!:"; then
            echo "### ⚠️ Breaking Changes" >> temp_changelog.md
            git log $LAST_TAG..HEAD --format="- %s" | grep -E "^- [a-z]+(\([a-z]+\))?!:" >> temp_changelog.md
            echo "" >> temp_changelog.md
          fi
          if git log $LAST_TAG..HEAD --format="%s" | grep -q "^feat"; then
            echo "### Features" >> temp_changelog.md
            git log $LAST_TAG..HEAD --format="- %s" | grep "^- feat" >> temp_changelog.md
            echo "" >> temp_changelog.md
          fi
          if git log $LAST_TAG..HEAD --format="%s" | grep -q -E "^refactor(\([a-z0-9_-]+\))?:"; then
            echo "### Code Refactoring" >> temp_changelog.md
            git log $LAST_TAG..HEAD --format="- %s" | grep -E "^- refactor(\([a-z0-9_-]+\))?:" >> temp_changelog.md
            echo "" >> temp_changelog.md
          fi
          if git log $LAST_TAG..HEAD --format="%s" | grep -q -E "^perf(\([a-z0-9_-]+\))?:"; then
            echo "### Performance Improvements" >> temp_changelog.md
            git log $LAST_TAG..HEAD --format="- %s" | grep -E "^- perf(\([a-z0-9_-]+\))?:" >> temp_changelog.md
            echo "" >> temp_changelog.md
          fi
          if git log $LAST_TAG..HEAD --format="%s" | grep -q "^fix"; then
            echo "### Bug Fixes" >> temp_changelog.md
            git log $LAST_TAG..HEAD --format="- %s" | grep "^- fix" >> temp_changelog.md
            echo "" >> temp_changelog.md
          fi
          if [ -f CHANGELOG.md ]; then
            cat CHANGELOG.md >> temp_changelog.md
          fi
          mv temp_changelog.md CHANGELOG.md

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          LOCAL_VERSION=$(cargo pkgid | cut -d# -f2 | cut -d: -f2)
          CRATE_NAME=$(cargo pkgid | cut -d# -f1 | awk -F/ '{print $NF}' | cut -d: -f1)
          if cargo search $CRATE_NAME | grep -q "$CRATE_NAME = \"$LOCAL_VERSION\""; then
            echo "Version $LOCAL_VERSION is already online. Skipping publish."
          else
            cargo publish --token $CARGO_REGISTRY_TOKEN
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git tag "v$LOCAL_VERSION"
            git push origin "v$LOCAL_VERSION"
          fi